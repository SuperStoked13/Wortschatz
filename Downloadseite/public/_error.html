<!doctype html>
<html lang="de-CH">
<head>
{{> head}}
  <title>{{error.title}}: Wortschatz</title>
  <meta name="robots" content="noindex">
</head>
<body class="page page-error">
{{> nav}}
  <main id="inhalt" class="error-page">
    <img class="error-icon" src="{{@asset /assets/img/icon-128.png}}" srcset="{{@asset /assets/img/icon-128.png}} 1x, {{@asset /assets/img/icon-256.png}} 2x" alt="" width="96" height="96">
    <p class="error-code">Fehler {{error.status}}</p>
    <h1>{{error.title}}</h1>
    <p class="error-message">{{error.message}}</p>
    <div class="error-actions">
      {{#error.retry}}<a class="btn btn-primary" href="/#download">Nochmals versuchen</a>{{/error.retry}}
      <a class="btn {{#error.retry}}btn-glass{{/error.retry}}{{^error.retry}}btn-primary{{/error.retry}}" href="/">Zur Startseite</a>
    </div>
  </main>
{{> footer}}
</body>
</html>
