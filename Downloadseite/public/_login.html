<!doctype html>
<html lang="de-CH">
<head>
{{> head}}
  <title>Anmelden: Wortschatz</title>
  <meta name="robots" content="noindex">
</head>
<body class="page page-login">
  <main id="inhalt" class="error-page login-page">
    <picture><source media="(prefers-color-scheme: dark)" srcset="{{@asset /assets/img/icon-dark-128.png}} 1x, {{@asset /assets/img/icon-dark-256.png}} 2x"><img class="error-icon" src="{{@asset /assets/img/icon-128.png}}" srcset="{{@asset /assets/img/icon-128.png}} 1x, {{@asset /assets/img/icon-256.png}} 2x" alt="" width="96" height="96"></picture>
    <h1>Wortschatz</h1>
    <p class="error-message">Diese Seite ist passwortgeschützt.</p>
    <form class="login-form" method="post" action="/login">
      <input type="hidden" name="weiter" value="{{login.next}}">
      <label class="login-label" for="passwort">Passwort</label>
      <input class="login-input" id="passwort" name="passwort" type="password" autocomplete="current-password" required autofocus>
      {{#login.wrong}}<p class="login-error" role="alert">Das Passwort stimmt nicht.</p>{{/login.wrong}}
      <button class="btn btn-primary login-button" type="submit">Anmelden</button>
    </form>
  </main>
{{> footer}}
</body>
</html>
